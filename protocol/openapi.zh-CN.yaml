                if_match: {type: string, description: "当前 key 的 etag，账户没有 key 时为 \"*\"。"}
                created_via: {$ref: "#/components/schemas/KeyOrigin"}
                idempotency_key: {type: string}
                initial_bundle: {$ref: "#/components/schemas/KeyBundleInput"}
      responses:
        "200":
          description: 已注册的 key。
          content:
            application/json:
              schema:
                type: object
                required: [ok, key_id]
