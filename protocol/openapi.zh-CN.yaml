openapi: 3.1.1

info:
  title: Tinfoil Chat 运行内核（harness）
  version: "1"
  description: |
    Tinfoil Chat 客户端与运行内核（harness）enclave 之间的协议。

    每个 chat 请求都是经由经过 attestation 的、EHBP 封存的传输通道发出的 POST，因此正文对客户端与 enclave 私密，而请求头对 gateway 可见。请求头只携带非私密内容：`Authorization` 携带调用方的身份（Clerk session token、未登录调用方的 `free_` key，或 `tk_` API key，其持有者按未登录调用方对待，并像 API 请求的调用方一样为该 chat 的联网搜索付费），`X-Tinfoil-Inference-Key` 携带客户端 mint 的 chat 访问权限，`Accept-Language` 携带调用方的语言。关于某个 run 的请求会指明持有它的实例，并在 follow 它时指明客户端已应用的最后一个 event。其余内容，包括路由需要时账户的 content key，都在正文中。

    一个 run 的 event 以 server-sent event 的形式到达。每一帧的 `data` 是一个 event，由 `x-item-schema`（OpenAPI 3.2 的 `itemSchema`）描述，其 `id` 是该 event 在该 run 中的游标，follow 该 run 的客户端会把它作为 `Last-Event-ID` 发回。一次 MESSAGES_SNAPSHOT 最多容纳 8 MiB 的 message：它会略去放不下的最旧 message 并设置 `hasOlder`，并把一条单独发送就过大的最新 message 连同其 attachment 的文本一并略去，客户端按读取已存储 chat 的方式读取它。

    harness 只保留长 run 中较新的 event。从这些 event 之前开始 follow 的客户端会先收到一个 checkpoint：run 从开始起的 event，按顺序，其中每一串扩展同一条 message 或同一个调用的 TEXT_MESSAGE_CHUNK、REASONING_MESSAGE_CHUNK 或 TOOL_CALL_ARGS event 会合并成更少的 event（保留 run 第一个和最后一个 event 的时间），每个 tool 的活动则作为其当前状态的一个 ACTIVITY_SNAPSHOT，放在其第一个 event 的位置。只有 checkpoint 的最后一帧带 `id`，因此漏掉其中一部分的客户端会再次收到全部内容；checkpoint 所持有的 run 自身的 MESSAGES_SNAPSHOT 会把 chat 恢复到 run 开始时的位置。

    本文档按如下规则演进，因此针对它发布的客户端可以持续工作：

    - 改动是增量式的。只要还有受支持的客户端在使用，路由、成员、event 或错误码就不会被移除，也不会改变含义。
    - 客户端忽略它不认识的成员和 event。它按错误的 action 处理它不认识的错误码。
    - 客户端读取任意大小的 event。harness 允许一个 event 增长到多大，由它自己决定。
    - 响应所持有的取值列表可以新增取值：这类列表是它所列举的取值与任意字符串的 anyOf。harness 只发送所列举的取值；客户端把它不认识的取值按该列表的说明处理。
    - 客户端完整保留一条 ThreadRecord，包括它不认识的成员，并按返回的原样发回。它可以在 ThreadInput 说明的位置略去该记录最新 compaction 标记之前的 message。
    - 对 ThreadRecord 或存储行内容的任何改动都会改变其 recordVersion。harness 按原样读取它认识的版本的记录，把没有版本的记录当作旧客户端保留的记录读取，并对其余任何记录以 RECORD_UNSUPPORTED 拒绝。它认识版本 1 和版本 2；版本 2 为 chat 增加了 compaction 标记，其余与版本 1 相同。
      版本 2 的 profile 行还可能持有 readAloudSpeed，harness 若未提及它也会保留它，就像它保留任何未提及的 profile 成员一样；下一个版本会提及它。版本 2 chat 的 reply 还可能持有 research，harness 若未提及它，在把 chat 写回时就会略去它，并按 reply 的 step 读取该 reply；下一个版本会提及它。
      harness 在写记录前会先读取它。存储行中它未提及的成员会被略过，因为同一行的其他客户端会写入各自的成员；harness 把行写回时会略去这些成员，但 profile 行除外。在 profile 行中它会保留这些成员，并且对它修改的每个字段，都会推进各应用自身 profile 同步保存在 fieldClocks 中的编辑时钟，用 clockVersion 标记时钟为当前，使这些应用仍能合并该行。
    - harness 忽略它不认识的请求成员，但 profile patch 除外，后者会拒绝它们。
    - 可选行为在 session 的 `features` 中声明。客户端只在该 feature 为 true 时依赖它。

    这里的 schema 都保持对象开放，因为客户端必须容忍更新的 harness 添加的成员。harness 的测试会把它发送的所有内容约束到封闭形式：它不会发送本文档未提及的任何成员。

    本文档旁边的 fixture 是 harness 录制的 run，供每个客户端在其测试中回放。fixture 的帧是带游标的 run event。客户端按顺序应用它们，跳过该 run 中游标已应用过的，然后必须展示预期内容所要求的东西：每条 message 的 id 和 role，question 或 compaction 标记的 content，以及 reply 的 timeline step 各自的 id、type，以及 content、toolCallId、name、arguments、complete、result、progress、display 中它们所拥有的任意几项，还有 reply 的 research（如果有的话）；chat 的 title 和 titleState；以及 run 是以空闲状态还是以错误结束：错误时，其 RUN_ERROR 中除 type、timestamp、threadId、runId 和 metadata 之外的每个成员。

servers:
  - url: https://chat-api.tinfoil.sh

security:
  - identity: []
    chatAccess: []
  - identity: []

tags:
  - name: session
    description: 客户端打开时获得的内容。
  - name: runs
    description: turn、其 run 的 event 流，以及正在运行的 reply 之后的队列。
  - name: threads
    description: 已存储的 chat 与设备 chat。
  - name: shares
    description: 分享链接及其打开。
  - name: profile
    description: 账户的设置。
  - name: projects
    description: project 及其 document。
  - name: keys
    description: 账户的 content key 及其 passkey bundle，即 control plane 保存的形式。
  - name: attachments
    description: 上传与 attachment 下载。
  - name: archives
    description: import 与 export。
  - name: speech
    description: 转写与朗读。
  - name: metadata
    description: 在 enclave 内抓取的图片、favicon 与链接预览。

paths:

  /healthz:
    get:
      operationId: health
      summary: 报告 harness 正在服务
      security: []
      responses:
        "200":
          description: harness 正在服务。
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {const: true}

  /metrics:
    get:
      operationId: metrics
      summary: 导出聚合服务指标
      description: Prometheus HTTP、run 生命周期与运行时指标。受监测的 shim 会在转发此运维端点前用 metrics.read 校验 admin key。不会导出任何 chat 内容、调用方标识或凭证。
      security:
        - metricsAdmin: []
      responses:
        "200":
          description: Prometheus 文本展示格式。
          content:
            text/plain:
              schema: {type: string}

  /v1/session:
    post:
      operationId: session
      summary: 打开应用
      tags: [session]
      description: 客户端打开应用时获得的内容。未登录调用方也会得到应答。
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {$ref: "#/components/responses/Session"}
        default: {$ref: "#/components/responses/Error"}

  /v1/changes:
    post:
      operationId: changes
      summary: 读取已存储数据的修订版本
      tags: [session]
      description: 账户已存储的 chat、profile 与 project 的修订版本，会在其他设备写入它们时变化。
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: 当前的修订版本。
          content:
            application/json:
              schema:
                type: object
                required: [chats, profile, projects]
                properties:
                  chats: {type: string}
                  profile: {type: string}
                  projects: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/turn:
    post:
      operationId: turn
      summary: 运行一个 turn
      tags: [runs]
      description: 启动一个 run，用于执行对 chat 的一次用户操作并流式输出。当 enclave 内存不足时，新的 turn 会以 SERVICE_BUSY 和 retryAfter 拒绝，好让已在运行的 reply 可以完成；对已启动的 turn 再次发送请求，仍会 follow 其 run。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Turn"}
      responses:
        "200": {$ref: "#/components/responses/RunEvents"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/browser/result:
    post:
      operationId: browserResult
      summary: 返回浏览器 action 的结果
      tags: [runs]
      description: |
        local browser turn 的 executor 会为待处理的 executionId 返回一个结果，
        该结果以该 turn 私有的 executor token 认证。在 run 存续期间，完全相同的
        retry 会被接受；冲突或未知的 execution 会被拒绝。客户端在行动前记录意图，
        在发送前记录结果。重放 event 绝不能重复执行某个 action。结果不确定时
        需要观察页面并由用户介入，而不是重放。截图只在本 run 期间送达模型；
        event 与返回的 thread 只携带文本。
      parameters:
        - {$ref: "#/components/parameters/HarnessInstance"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrowserResultInput"}
      responses:
        "200":
          description: 结果已被接受。
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {const: true}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/follow:
    post:
      operationId: follow
      summary: 重新接入一个正在进行的 run
      tags: [runs]
      parameters:
        - {$ref: "#/components/parameters/HarnessInstance"}
        - {$ref: "#/components/parameters/LastEventId"}
      description: 为丢失流的客户端从它已应用的最后一个 event 之后重新流式输出一个正在进行的 run。设备 chat 的 run 在结束后仍可被 follow 三十分钟，直到再次 follow 它的客户端把它读到末尾，这样丢失流的客户端就能拿到该 run 返回的 chat。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FollowInput"}
      responses:
        "200": {$ref: "#/components/responses/RunEvents"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/cancel:
    post:
      operationId: cancel
      summary: 停止一个 run
      description: 停止该 chat 正在运行的 reply。排在它后面的 turn 也随之结束，各带一个 cancelled 的 RUN_FINISHED，因此 chat 的 reply 一旦停止，harness 就不再保留它的任何内容。仍在排队的 turn 则被移除，就像 queue/remove 那样移除它，它前面的 reply 继续。
      tags: [runs]
      parameters: [{$ref: "#/components/parameters/HarnessInstance"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunRequest"}
      responses:
        "200": {$ref: "#/components/responses/Empty"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/queue/send:
    post:
      operationId: queueSend
      summary: 立即发送一个排队的 turn
      tags: [runs]
      parameters: [{$ref: "#/components/parameters/HarnessInstance"}]
      description: 立即启动排在正在运行的 reply 后面的 turn，并停止该 reply。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunRequest"}
      responses:
        "200": {$ref: "#/components/responses/Empty"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/queue/remove:
    post:
      operationId: queueRemove
      summary: 移除一个排队的 turn
      tags: [runs]
      parameters: [{$ref: "#/components/parameters/HarnessInstance"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunRequest"}
      responses:
        "200": {$ref: "#/components/responses/Empty"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/list:
    post:
      operationId: list
      summary: 列出已存储的 chat
      tags: [threads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                cursor: {type: string}
                projectId: {type: string}
                limit: {type: integer}
      responses:
        "200":
          description: 账户已存储 chat 的一页，最新在前，以及其置顶的 chat。
          content:
            application/json:
              schema:
                type: object
                required: [threads, nextCursor, pinned]
                properties:
                  threads: {type: array, items: {$ref: "#/components/schemas/ThreadSummary"}}
                  nextCursor: {type: string, description: "最后一页为空。"}
                  pinned: {type: array, items: {$ref: "#/components/schemas/ThreadSummary"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/search:
    post:
      operationId: search
      summary: 搜索已存储的 chat
      tags: [threads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                query: {type: string}
                limit: {type: integer}
      responses:
        "200":
          description: 匹配的已存储 chat、harness 无法打开的其他匹配数量，以及搜索索引是否仍在构建中。control plane 未能及时提供的 chat 会以 UPSTREAM_REFUSED 使搜索失败，搜索索引重建失败则以 SEARCH_INDEX_FAILED 表示。
          content:
            application/json:
              schema:
                type: object
                required: [results, unreadable, indexing]
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/ThreadSummary"}}
                  unreadable: {type: integer, minimum: 0, description: "因无法打开而未纳入结果的匹配 chat，例如用另一个 key 封存的，或以本 harness 无法读取的格式存储的。"}
                  indexing: {type: boolean}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/get:
    post:
      operationId: get
      summary: 打开一个已存储的 chat
      tags: [threads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                id: {$ref: "#/components/schemas/Identifier"}
                before: {type: string, description: "一个 message id；窗口在其之前结束。"}
                limit: {type: integer, description: "至多 200；缺省为 50。"}
      responses:
        "200": {$ref: "#/components/responses/ThreadWindow"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/update:
    post:
      operationId: update
      summary: 修改 chat 的设置
      tags: [threads]
      description: 修改 chat 的设置。云端 chat 返回其摘要，设备 chat 返回其新记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                local: {type: boolean}
                thread: {$ref: "#/components/schemas/ThreadInput"}
                profile: {$ref: "#/components/schemas/ProfileInput"}
                id: {$ref: "#/components/schemas/Identifier"}
                title: {type: string}
                model: {type: string}
                webSearchEnabled: {type: boolean}
                pinned: {type: boolean, description: "仅限云端 chat。"}
                projectId: {type: [string, "null"], description: "仅限云端 chat。null 会把该 chat 从其 project 中移出。"}
                presetId: {type: [string, "null"], description: "选择另一个 prompt 会采用它所选定的设置，但本请求所设置的除外。"}
      responses:
        "200":
          description: 修改后的 chat。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/ThreadSummary"}
                  - {$ref: "#/components/schemas/DeviceThreadReply"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/fork:
    post:
      operationId: fork
      summary: 派生一个 chat
      tags: [threads]
      description: 把 chat 复制到其某条 message 为止的内容，形成一个新的 chat。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessageRequest"}
      responses:
        "200":
          description: 新的 chat。
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/ThreadSummary"}
                  - {$ref: "#/components/schemas/DeviceThreadReply"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/messages/delete:
    post:
      operationId: messageDelete
      summary: 删除一条 message
      tags: [threads]
      description: 删除一条 message，以及其后摘要覆盖了它的每个 compaction 标记。compaction 标记本身不会被删除。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessageRequest"}
      responses:
        "200": {$ref: "#/components/responses/ChangedThread"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/messages/update:
    post:
      operationId: messageUpdate
      summary: 编辑一条 reply
      tags: [threads]
      description: 原地编辑 reply 的文本，并删除其后摘要覆盖了该 reply 原状的每个 compaction 标记。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threadId, messageId, content]
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                local: {type: boolean}
                thread: {$ref: "#/components/schemas/ThreadInput"}
                profile: {$ref: "#/components/schemas/ProfileInput"}
                threadId: {$ref: "#/components/schemas/Identifier"}
                messageId: {$ref: "#/components/schemas/Identifier"}
                content: {type: string}
      responses:
        "200": {$ref: "#/components/responses/ChangedThread"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/messages/answer:
    post:
      operationId: messageAnswer
      summary: 回答 reply 的问题
      tags: [threads]
      description: |
        保存用户在 reply 的某个 questions widget 中所选的 option，而不启动 turn。
        每个被指明的 question 采用所选的 option，其余保持其 answer。用户接下来
        发送的 question 会携带已更改的 answer，模型正是这样读取它们的。
        chat 已不再持有的 widget、question 或 option 会以 REVISION_CONFLICT 拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threadId, messageId, toolCallId, answers]
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                local: {type: boolean}
                thread: {$ref: "#/components/schemas/ThreadInput"}
                profile: {$ref: "#/components/schemas/ProfileInput"}
                threadId: {$ref: "#/components/schemas/Identifier"}
                messageId: {$ref: "#/components/schemas/Identifier"}
                toolCallId: {type: string, description: "questions widget 的调用。"}
                answers:
                  type: object
                  minProperties: 1
                  description: "按 question id 给出所选 option 的 id，或 null 表示该 question 不回答。单选 question 只接受一个 option。"
                  additionalProperties:
                    type: [array, "null"]
                    items: {type: string}
      responses:
        "200": {$ref: "#/components/responses/ChangedThread"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/delete:
    post:
      operationId: delete
      summary: 删除一个 chat
      tags: [threads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                id: {$ref: "#/components/schemas/Identifier"}
                revision: {type: string, description: "当把已移到设备的 chat 从云端删除时设置；此时 delete 需要该移入操作所读取的 revision。"}
                local: {type: boolean, description: "该 chat 是客户端删除的设备 chat。其正在运行的 reply 会停止，harness 会丢弃它所保留的该 chat 的 reply；已存储内容不变。"}
      responses:
        "200": {$ref: "#/components/responses/Empty"}
        default: {$ref: "#/components/responses/Error"}

  /v1/threads/delete-all:
    post:
      operationId: deleteAll
      summary: 删除所有 chat
      tags: [threads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                projectId: {type: [string, "null"]}
                local: {type: boolean, description: "客户端删除了所有设备 chat。它们正在运行的 reply 会停止，harness 会丢弃它所保留的这些 chat 的 reply；已存储内容不变。计数是它保留过任何内容的 chat 的数量。"}
