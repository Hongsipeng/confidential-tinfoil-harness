          application/json:
            schema:
              type: object
              required: [key_id, key, credential_id, idempotency_key]
              properties:
                key_id: {type: string}
                key: {type: string, description: "content key，base64 编码。"}
                credential_id: {type: string}
                idempotency_key: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}

  /v1/keys/migrate-all:
