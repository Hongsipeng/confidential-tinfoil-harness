  /v1/profile/get:
    post:
      operationId: profileGet
      summary: 读取 profile
      tags: [profile]
      description: 对账户注册 key 之外的 key 以 KEY_MISMATCH 拒绝，即使尚未存储 profile 也是如此，因此客户端能从这次读取得知其 key 能否打开该账户。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Keyed"}
      responses:
        "200": {$ref: "#/components/responses/Profile"}
        default: {$ref: "#/components/responses/Error"}

  /v1/profile/update:
    post:
      operationId: profileUpdate
      summary: 修改 profile
      tags: [profile]
      description: 设置 patch 所指明的字段，随后在适用时把保存的 prompt 与收藏编辑应用到存储中的 profile。当 session 的 features.promptPresetEdits 为 true 时，客户端通过这些编辑修改保存的 prompt 与收藏，而不是发送它早先读取的整份列表；当 features.promptPresetUpdates 为 true 时，客户端通过只指明用户改动内容的 update 来修改保存的 prompt，而不是保存它早先读取的副本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {type: string, description: "账户的 content key，base64 编码。设备 chat 与未登录调用方不携带。"}
                patch:
                  description: 要设置的字段。profile 不存在的字段会被拒绝。null 的 defaultPromptPresetId 会清除默认 prompt。
                  type: object
                  properties:
                    themeMode: {type: string, enum: [light, dark, system]}
                    chatFont: {type: string, enum: [system, serif, mono, dyslexic]}
                    language: {type: string}
                    nickname: {type: string}
                    profession: {type: string}
                    traits: {type: array, items: {type: string}}
                    additionalContext: {type: string}
                    isUsingPersonalization: {type: boolean}
                    isUsingCustomPrompt: {type: boolean}
                    customSystemPrompt: {type: string}
                    customPromptPresets: {type: array, items: {$ref: "#/components/schemas/CustomPreset"}}
                    favoritePromptPresetIds: {type: array, items: {type: string}}
                    defaultPromptPresetId: {type: [string, "null"]}
                    selectedModel: {type: string}
                    autoIntelligence: {type: string}
                    reasoningEffort: {type: string}
                    thinkingEnabled: {type: boolean}
                    webSearchEnabled: {type: boolean}
                    webSearchAvailable: {type: boolean}
                    piiCheckEnabled: {type: boolean}
                    genUIEnabled: {type: boolean}
                    pixelateSidebarChatTitlesEnabled: {type: boolean}
                    browserTabChatTitleEnabled: {type: boolean}
                    enterToNewlineEnabled: {type: boolean}
                    readAloudSpeed: {type: number, minimum: 0.5, maximum: 2}
                    hasSeenOnboarding: {type: boolean}
                    hasSeenWebSearchIntro: {type: boolean}
                    dismissed: {type: object, additionalProperties: {type: boolean}}
                savePromptPresets: {type: array, items: {$ref: "#/components/schemas/CustomPreset"}, description: "要添加的已保存 prompt，每个都会按 id 替换存储中位于原处的那个。"}
                updatePromptPresets: {type: array, items: {$ref: "#/components/schemas/PresetUpdate"}, description: "对已保存 prompt 的修改，在保存之后应用。每个都按 id 设置存储中的 prompt 上它所指明的成员；已不再存储的 prompt 保持删除状态。"}
                deletePromptPresetIds: {type: array, items: {type: string}, description: "要移除的已保存 prompt。被移除的 prompt 不再是收藏，若它原是默认 prompt 则一并清除。"}
                addFavoritePromptPresetIds: {type: array, items: {type: string}, description: "要添加到收藏末尾的 prompt，除非它们已是收藏。"}
                removeFavoritePromptPresetIds: {type: array, items: {type: string}, description: "要从收藏中移除的 prompt。"}
      responses:
        "200": {$ref: "#/components/responses/Profile"}
        default: {$ref: "#/components/responses/Error"}

  /v1/profile/upgrade:
    post:
      operationId: profileUpgrade
      summary: 转换旧客户端保留的设置
      tags: [profile]
      description: 把旧客户端在设备上保留的设置转换为当前 profile。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: {$ref: "#/components/schemas/ProfileInput"}
      responses:
        "200":
          description: 作为 profile 的设置。
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: {$ref: "#/components/schemas/Profile"}
        default: {$ref: "#/components/responses/Error"}

