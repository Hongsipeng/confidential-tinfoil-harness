      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: 当前的 key。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyCurrent"}
        default: {$ref: "#/components/responses/Error"}

  /v1/keys/register:
    post:
      operationId: keysRegister
      summary: 注册一个 content key
      tags: [keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, if_match, created_via, idempotency_key]
