                  ok: {const: true}
                  key_id: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/keys/add-bundle:
    post:
      operationId: keysAddBundle
      summary: 向 content key 添加一个 passkey bundle
      tags: [keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id, kek_iv, encrypted_keys, key_id, key, idempotency_key]
              properties:
                credential_id: {type: string}
                kek_iv: {type: string, description: "AES-GCM IV，hex 编码。"}
                encrypted_keys: {type: string, description: "封装后的 content key，hex 编码。"}
                key_id: {type: string}
                key: {type: string, description: "content key，base64 编码。"}
                idempotency_key: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Error"}

  /v1/keys/remove-bundle:
    post:
      operationId: keysRemoveBundle
      summary: 从 content key 移除一个 passkey bundle
      tags: [keys]
      requestBody:
        required: true
